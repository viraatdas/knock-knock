<style>
  @page { size: 8.5in 11in; margin: 0; }

  }

    height: 1px;
    background: #E6DCCB;
    margin: 0.32in 0 0.55in;
  }

  h1 {

    font-weight: 600;

  }

  .sub {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 400;
    font-style: italic;
    font-size: 24pt;
    line-height: 1.3;

    margin-bottom: 0.75in;
  }
  .doors .time {

    font-size: 46pt;
    color: #2A211B;
    letter-spacing: -0.01em;
  }
  .doors .label {
    font-family: 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-weight: 500;
    font-size: 13pt;
    color: #8A7C6D;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .qr-frame {
    width: 3.1in;
    height: 3.1in;
    background: #FFFFFF;
    border: 1.5pt solid #E6DCCB;
    border-radius: 22pt;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.22in;

</style>
