<title>Knock Knock. Simple Flyer</title>
<style>
  @page { size: 8.5in 11in; margin: 0; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 8.5in; height: 11in;
    background: #FFFFFF;
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
    color: #2A211B;
    overflow: hidden;
  }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  .sheet {
    width: 8.5in; height: 11in;
    padding: 0.55in 0.6in;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: #FFFFFF;
  }

  .wordmark {
    font-family: 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-weight: 700;
    font-size: 15pt;
    letter-spacing: 0.02em;
    color: #2A211B;
  }
  .wordmark .dot { color: #D4694F; }

  .rule {
    width: 100%;
    height: 1px;
    background: #E6DCCB;
    margin: 0.32in 0 0.55in;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 58pt;
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0 0 0.22in;
    max-width: 6.7in;
    text-wrap: balance;
  }

  .sub {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 400;
    font-style: italic;
    font-size: 24pt;
    line-height: 1.3;
    color: #6B5D4F;
    margin: 0 0 0.7in;
    max-width: 5.6in;
    text-wrap: balance;
  }

  .doors {
    display: flex;
    align-items: baseline;
    gap: 0.18in;
    margin-bottom: 0.75in;
  }
  .doors .time {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 700;
    font-size: 46pt;
    color: #2A211B;
    letter-spacing: -0.01em;
  }
  .doors .label {
    font-family: 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-weight: 500;
    font-size: 13pt;
    color: #8A7C6D;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .qr-frame {
    width: 3.1in;
    height: 3.1in;
    background: #FFFFFF;
    border: 1.5pt solid #E6DCCB;
    border-radius: 22pt;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.22in;
    box-shadow: 0 10pt 28pt rgba(42, 33, 27, 0.08);
  }
  #qr { width: 100%; height: 100%; }
  /* The library draws at a fixed pixel size (620x620); force it down to the
     frame's actual box so it doesn't overflow, uncropped and un-rounded —
     rounding a QR's own corners destroys its finder patterns. */
  #qr canvas, #qr svg, #qr img { display: block; width: 100% !important; height: 100% !important; }
</style>

<div class="sheet">
  <div class="wordmark">KNOCK KNOCK<span class="dot">.</span></div>
  <div class="rule"></div>

  <h1>Go on 5&#8209;minute<br>speed dates.</h1>
  <div class="sub">And potentially meet<br>the love of your life.</div>

  <div class="doors">
    <span class="time">7:00 PM</span>
    <span class="label">Doors&nbsp;Open</span>
  </div>

  <div class="qr-frame">
    <div id="qr" role="img" aria-label="QR code to Knock Knock on the App Store"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
<script>
  new QRCodeStyling({
    width: 620,
    height: 620,
    data: "https://apps.apple.com/us/app/knock-knock-5-minute-dates/id6774902208",
    margin: 8,
    qrOptions: { errorCorrectionLevel: "H" },
    dotsOptions: { type: "rounded", color: "#D4694F" },
    cornersSquareOptions: { type: "extra-rounded", color: "#2A211B" },
    cornersDotOptions: { type: "dot", color: "#2A211B" },
    backgroundOptions: { color: "#FFFFFF" },
  }).append(document.getElementById("qr"));
</script>
