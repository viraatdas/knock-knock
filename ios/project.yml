name: Slide
options:
  bundleIdPrefix: app.exla.slide
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    # 2.13 exposes CallKit-coordinated audio engine availability. Older SDKs
    # can start WebRTC audio before CXProvider activates AVAudioSession.
    minVersion: "2.13.0"
    maxVersion: "3.0.0"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    minVersion: "11.0.0"
    maxVersion: "12.0.0"

targets:
  Slide:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.exla.slide
        MARKETING_VERSION: "1.1.2"
        CURRENT_PROJECT_VERSION: "39"
        # Phone-only. Pinned on the target so xcodegen can't fall back to "1,2".
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Knock Knock
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        # Phone-only, iPhone family only, portrait only. No iPad orientation
        # keys so the build doesn't declare iPad support (which would force
        # iPad screenshots). The date screen is portrait like the rest of the
        # app; no CallKit-driven rotation anymore.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSCameraUsageDescription: "Knock Knock uses your camera for video dates."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Knock Knock uses your microphone for video dates."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Knock Knock uses your location to find people within 75 miles. It's stored rounded to about a kilometer."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
      configs:
        # Push Notifications capability via the entitlements file. APNs env is
        # "development" for Debug and "production" for Release/TestFlight. The
        # App ID (app.exla.slide) has Push enabled (enable_push_capability lane).
        Debug:
          CODE_SIGN_ENTITLEMENTS: Slide.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: SlideRelease.entitlements
          # Manual signing pinned to the APP TARGET ONLY (SPM packages like
          # Firebase/GoogleUtilities reject manual profiles — must stay automatic).
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "app.exla.slide AppStore"
    info:
      path: Generated-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - app-1-561354442144-ios-898901de87c419eec650c5
        # Speed-date pivot: no CallKit, no PushKit, no VoIP. `audio` keeps a
        # date's audio alive if the phone locks mid-date; that's the only
        # background mode this app needs.
        UIBackgroundModes:
          - audio
        # We forward all APNs/url callbacks to Firebase manually (AppDelegate);
        # swizzling off so the SwiftUI adaptor can't silently eat them.
        FirebaseAppDelegateProxyEnabled: false
    dependencies:
      - package: LiveKit
        product: LiveKit
      - package: Firebase
        product: FirebaseAuth

schemes:
  Slide:
    build:
      targets:
        Slide: all
    run:
      config: Debug
    archive:
      config: Release
