<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Knock Knock - 5 Minute Dates: five-minute video dates, every night, 7 to 8 PM Pacific">
  <rect width="1200" height="630" fill="#FAF6EF"/>

  <!-- door + knocking figure mark, centered -->
  <g transform="translate(497,120)">
    <!-- door -->
    <rect x="104" y="0" width="52" height="112" rx="6" fill="#7A5A3E"/>
    <rect x="110" y="8" width="40" height="96" rx="4" fill="none" stroke="#5A4632" stroke-width="2.5"/>
    <circle cx="113" cy="56" r="3.5" fill="#D4694F"/>
    <!-- knock arcs -->
    <g fill="none" stroke="#D4694F" stroke-width="3" stroke-linecap="round">
      <path d="M92 44 a10 10 0 0 1 0 20"/>
      <path d="M98 40 a16 16 0 0 1 0 28"/>
    </g>
    <!-- stick figure knocking -->
    <g fill="none" stroke="#2A211B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="58" cy="18" r="12" fill="#2A211B" stroke="none"/>
      <line x1="58" y1="30" x2="56" y2="72"/>
      <line x1="56" y1="72" x2="44" y2="100"/>
      <line x1="56" y1="72" x2="70" y2="100"/>
      <line x1="58" y1="40" x2="42" y2="64"/>
      <line x1="58" y1="40" x2="88" y2="28"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="600" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="104" font-weight="300" letter-spacing="0.01em" text-anchor="middle" fill="#2A211B">Knock Knock</text>

  <!-- tagline -->
  <text x="600" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="300" letter-spacing="0.005em" text-anchor="middle" fill="#8A7C6D">Five-minute video dates. Every night, 7 to 8 PM Pacific.</text>

  <!-- details -->
  <text x="600" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" letter-spacing="0.16em" text-anchor="middle" fill="#8A7C6D">PHONE NUMBER ONLY · 75 MILES · KEEP TALKING OR PASS</text>
</svg>
